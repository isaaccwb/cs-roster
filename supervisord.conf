[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
[program:init]
command=bash -c "cd /app/backend && flask db upgrade 2>/dev/null; python seed_demo.py || true"
directory=/app/backend
autostart=true
autorestart=false
startsecs=0
priority=10
[program:gunicorn]
command=bash -c "sleep 5; exec gunicorn --bind 127.0.0.1:5000 --workers 2 --timeout 120 run:app"
directory=/app/backend
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
